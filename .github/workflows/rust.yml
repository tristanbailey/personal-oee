name: Rust

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  release:
    # Runs only for a version tag (e.g. v1.0.9), after the build and tests pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Check tag matches Cargo.toml version
      run: |
        VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
        if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
          echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$VERSION"
          exit 1
        fi
    - name: Build app bundle
      run: scripts/bundle.sh
    - name: Build CLI
      run: cargo build --release -p oee-cli
    - name: Package
      run: |
        mkdir -p release
        ditto -c -k --keepParent dist/PersonalOEE.app "release/PersonalOEE-${GITHUB_REF_NAME}-macos-$(uname -m).zip"
        tar -czf "release/office-oee-${GITHUB_REF_NAME}-macos-$(uname -m).tar.gz" -C target/release office-oee
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" release/* --title "Personal OEE $GITHUB_REF_NAME" --generate-notes
